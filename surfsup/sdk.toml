id = "surfsup"
name = "SurfsUp"
version = "10"
description = "Surf maps for SurfsUp: the Surf Ramp generator, start, split and finish zones, the game's materials and Play in SurfsUp."
plugins = ["godot", "source-bsp", "surfsup"]
fgd = ["fgd/surfsup.fgd"]
# Zones are untextured and show their class color; SurfsUp never draws them.
triggers = ["zone_*", "teleport_zone", "bhop_zone", "kill_box"]

# Lighting bakes with MapCraft's baker into a .mclight file the game's importer applies as lightmaps.
[lightmaps]
luxel = 64
bounces = 1
rays = 32

# `textures` holds editor copies of the game's Materials; the game uses its own.
[textures]
roots = ["textures"]
extensions = ["png", "jpg", "jpeg"]
default = "ramps-orange1"
scale = 1.0

# `models` holds the editor models of the platforms and the player start.
[models]
roots = ["models"]
class = "prop_static"

# Imported Source maps read their stock textures from the game's packages; CS:S uses HL2's too.
[files]
roots = ["${cstrike}", "${cstrike}/../hl2"]

[paths.game]
prompt = "SurfsUp game executable"
kind = "file"
steam = { app = 3454830, find = ["SurfsUp.x86_64", "SurfsUp.exe"] }

[paths.godot]
prompt = "Godot executable for running the SurfsUp project from source (developers only)"
kind = "file"

[paths.surfsup_project]
prompt = "SurfsUp Godot project folder, the one holding project.godot (developers only)"

[paths.cstrike]
prompt = "Counter-Strike: Source game folder (the cstrike folder), for textures of imported BSP maps"
steam = { app = 240, find = ["cstrike"] }

# SurfsUp loads maps straight from the Maps folder next to its executable: a .mcpck holding the map and its custom pictures and models, else a plain .mcmap.
# Started from Steam, the editor carries its own app id, which the game must not inherit.
[[compile]]
name = "Play in SurfsUp"
steps = [
    { pack = "${map}", to = "${game_dir}/Maps/${map_name}.mcpck" },
    { run = "${game}", args = ["+map", "${map_name}"], env = { SteamAppId = "3454830", SteamGameId = "3454830" } },
]

# Developers: runs the SurfsUp Godot project from source with the given Godot binary; the game loads res://Maps first.
[[compile]]
name = "Play in SurfsUp project (dev)"
steps = [
    { pack = "${map}", to = "${surfsup_project}/Maps/${map_name}.mcpck" },
    { run = "${godot}", args = ["--path", "${surfsup_project}", "+map", "${map_name}"], env = { SteamAppId = "3454830", SteamGameId = "3454830" } },
]

[workshop]
app = 3454830
tags = ["Map", "Surf", "Bhop", "Jump", "Climb"]

id = "surfsup"
name = "SurfsUp"
version = "4"
plugins = ["godot", "source-bsp", "surfsup"]
fgd = ["fgd/surfsup.fgd"]

[textures]
roots = ["${project}/Assets/Textures"]
extensions = ["png", "jpg", "jpeg"]
default = "ramps-orange1"
scale = 1.0

# Props: model paths are relative to the project, as Godot's res:// paths are; `models` holds the platforms' editor models.
[models]
roots = ["${project}", "models"]
class = "prop_static"

# Imported Source maps read their stock textures from the game's packages; CS:S uses HL2's too.
[files]
roots = ["${cstrike}", "${cstrike}/../hl2"]

[paths.project]
prompt = "SurfsUp Godot project folder"

[paths.godot]
prompt = "Godot editor executable"
kind = "file"

[paths.game]
prompt = "SurfsUp game executable"
kind = "file"

[paths.maps]
prompt = "Folder SurfsUp loads maps from (Maps next to the game)"

[paths.cstrike]
prompt = "Counter-Strike: Source game folder (the cstrike folder), for textures of imported BSP maps"

# SurfsUp loads .mcmap files straight from its Maps folder, through the MapCraft Godot addon
# (godot/addons/mapcraft), which the project or game must include.
[[compile]]
name = "Play in SurfsUp project"
steps = [
    { copy = "${map}", to = "${project}/Maps/${map_name}.mcmap" },
    { run = "${godot}", args = ["--path", "${project}", "+map", "${map_name}"] },
]

[[compile]]
name = "Play in SurfsUp"
steps = [
    { copy = "${map}", to = "${maps}/${map_name}.mcmap" },
    { run = "${game}", args = ["+map", "${map_name}"] },
]

id = "cstrike"
name = "Counter-Strike: Source"
version = "3"
description = "Valve's Counter-Strike: Source: .vmf import and export, the game's materials, and vbsp, vvis and vrad compiles, native on Linux."
plugins = ["source", "source-bsp"]
# Valve's entity definitions from the game's Windows version, which the Linux version lacks.
fgd = ["fgd/cstrike.fgd"]
# Source's coordinate limit; vbsp leaks or fails past it.
map_size = [-16384, 16384]

[textures]
default = "dev/dev_measuregeneric01b"
scale = 0.25

# The plugins read materials from the game's packages; CS:S uses HL2's too.
[files]
roots = ["${cstrike}", "${cstrike}/../hl2"]

# The Models tab places the game's models, from its packages, as static props.
[models]
class = "prop_static"

[paths.cstrike]
prompt = "Counter-Strike: Source game folder (the cstrike folder)"

# Linux runs vbsp, vvis and vrad built for Linux from the Source SDK and placed in the game's bin/linux64 beside the libraries they load.
# The .vmf goes in a build folder beside the map, so a mapper's own .vmf of the same name is never overwritten.

[[compile]]
name = "Fast"
os = "linux"
steps = [
    { export = "vmf", to = "${map_dir}/build/${map_name}.vmf" },
    { run = "${cstrike}/../bin/linux64/vbsp", args = ["-game", "${cstrike}", "${map_dir}/build/${map_name}.vmf"], cwd = "${map_dir}/build", env = { LD_LIBRARY_PATH = "${cstrike}/../bin/linux64" } },
    { run = "${cstrike}/../bin/linux64/vvis", args = ["-fast", "-game", "${cstrike}", "${map_dir}/build/${map_name}.bsp"], cwd = "${map_dir}/build", env = { LD_LIBRARY_PATH = "${cstrike}/../bin/linux64" } },
    { run = "${cstrike}/../bin/linux64/vrad", args = ["-fast", "-bounce", "2", "-noextra", "-game", "${cstrike}", "${map_dir}/build/${map_name}.bsp"], cwd = "${map_dir}/build", env = { LD_LIBRARY_PATH = "${cstrike}/../bin/linux64" } },
    { copy = "${map_dir}/build/${map_name}.bsp", to = "${cstrike}/maps/${map_name}.bsp" },
]

[[compile]]
name = "Compile"
os = "linux"
steps = [
    { export = "vmf", to = "${map_dir}/build/${map_name}.vmf" },
    { run = "${cstrike}/../bin/linux64/vbsp", args = ["-game", "${cstrike}", "${map_dir}/build/${map_name}.vmf"], cwd = "${map_dir}/build", env = { LD_LIBRARY_PATH = "${cstrike}/../bin/linux64" } },
    { run = "${cstrike}/../bin/linux64/vvis", args = ["-game", "${cstrike}", "${map_dir}/build/${map_name}.bsp"], cwd = "${map_dir}/build", env = { LD_LIBRARY_PATH = "${cstrike}/../bin/linux64" } },
    { run = "${cstrike}/../bin/linux64/vrad", args = ["-game", "${cstrike}", "${map_dir}/build/${map_name}.bsp"], cwd = "${map_dir}/build", env = { LD_LIBRARY_PATH = "${cstrike}/../bin/linux64" } },
    { copy = "${map_dir}/build/${map_name}.bsp", to = "${cstrike}/maps/${map_name}.bsp" },
]

[[compile]]
name = "Final"
os = "linux"
steps = [
    { export = "vmf", to = "${map_dir}/build/${map_name}.vmf" },
    { run = "${cstrike}/../bin/linux64/vbsp", args = ["-game", "${cstrike}", "${map_dir}/build/${map_name}.vmf"], cwd = "${map_dir}/build", env = { LD_LIBRARY_PATH = "${cstrike}/../bin/linux64" } },
    { run = "${cstrike}/../bin/linux64/vvis", args = ["-game", "${cstrike}", "${map_dir}/build/${map_name}.bsp"], cwd = "${map_dir}/build", env = { LD_LIBRARY_PATH = "${cstrike}/../bin/linux64" } },
    { run = "${cstrike}/../bin/linux64/vrad", args = ["-both", "-final", "-game", "${cstrike}", "${map_dir}/build/${map_name}.bsp"], cwd = "${map_dir}/build", env = { LD_LIBRARY_PATH = "${cstrike}/../bin/linux64" } },
    { copy = "${map_dir}/build/${map_name}.bsp", to = "${cstrike}/maps/${map_name}.bsp" },
]

[[compile]]
name = "Build and play"
os = "linux"
steps = [
    { export = "vmf", to = "${map_dir}/build/${map_name}.vmf" },
    { run = "${cstrike}/../bin/linux64/vbsp", args = ["-game", "${cstrike}", "${map_dir}/build/${map_name}.vmf"], cwd = "${map_dir}/build", env = { LD_LIBRARY_PATH = "${cstrike}/../bin/linux64" } },
    { run = "${cstrike}/../bin/linux64/vvis", args = ["-game", "${cstrike}", "${map_dir}/build/${map_name}.bsp"], cwd = "${map_dir}/build", env = { LD_LIBRARY_PATH = "${cstrike}/../bin/linux64" } },
    { run = "${cstrike}/../bin/linux64/vrad", args = ["-game", "${cstrike}", "${map_dir}/build/${map_name}.bsp"], cwd = "${map_dir}/build", env = { LD_LIBRARY_PATH = "${cstrike}/../bin/linux64" } },
    { copy = "${map_dir}/build/${map_name}.bsp", to = "${cstrike}/maps/${map_name}.bsp" },
    { run = "steam", args = ["-applaunch", "240", "-novid", "-console", "+map", "${map_name}"] },
]


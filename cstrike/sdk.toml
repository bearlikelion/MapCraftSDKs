[[compile]]
name = "Build and play"
os = "windows"
steps = [
    { export = "vmf", to = "${map_dir}/build/${map_name}.vmf" },
    { run = "${cstrike}/../bin/x64/vbsp.exe", args = ["-game", "${cstrike}", "${map_dir}/build/${map_name}.vmf"], cwd = "${map_dir}/build" },
    { run = "${cstrike}/../bin/x64/vvis.exe", args = ["-game", "${cstrike}", "${map_dir}/build/${map_name}.bsp"], cwd = "${map_dir}/build" },
    { run = "${cstrike}/../bin/x64/vrad.exe", args = ["-game", "${cstrike}", "${map_dir}/build/${map_name}.bsp"], cwd = "${map_dir}/build" },
    { copy = "${map_dir}/build/${map_name}.bsp", to = "${cstrike}/maps/${map_name}.bsp" },
    { run = "${cstrike}/../cstrike_win64.exe", args = ["-game", "cstrike", "-hijack", "-novid", "-console", "+map", "${map_name}"], cwd = "${cstrike}/.." },
]

# The Windows version of the game on Linux, with its compilers run through Wine.

[[compile]]
name = "Compile with Wine"
os = "linux"
steps = [
    { export = "vmf", to = "${map_dir}/build/${map_name}.vmf" },
    { run = "${cstrike}/../bin/x64/vbsp.exe", args = ["-game", "${cstrike}", "${map_dir}/build/${map_name}.vmf"], wine = true, cwd = "${map_dir}/build" },
    { run = "${cstrike}/../bin/x64/vvis.exe", args = ["-game", "${cstrike}", "${map_dir}/build/${map_name}.bsp"], wine = true, cwd = "${map_dir}/build" },
    { run = "${cstrike}/../bin/x64/vrad.exe", args = ["-game", "${cstrike}", "${map_dir}/build/${map_name}.bsp"], wine = true, cwd = "${map_dir}/build" },
    { copy = "${map_dir}/build/${map_name}.bsp", to = "${cstrike}/maps/${map_name}.bsp" },
]
